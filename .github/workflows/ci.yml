name: Node.js CI

on:
  push:
    branches:
      - main  # Trigger workflow on pushes to the 'main' branch
  pull_request:
    branches:
      - main  # Trigger workflow on pull requests to the 'main' branch

jobs:
  # Job 1: Checkout Code
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

  # Job 2: Set up Node.js
  setup-node:
    runs-on: ubuntu-latest
    needs: checkout  # This job depends on the completion of the 'checkout' job
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Specify the version of Node.js (adjust as needed)

  # Job 3: Install Dependencies
  install-dependencies:
    runs-on: ubuntu-latest
    needs: setup-node  # This job depends on the completion of the 'setup-node' job
    steps:
      - name: Install dependencies
        run: npm install

  # Job 4: Run Tests
  run-tests:
    runs-on: ubuntu-latest
    needs: install-dependencies  # This job depends on the completion of the 'install-dependencies' job
    steps:
      - name: Run tests
        run: npm test

  # Job 5: Deploy (Echo Statement for demonstration)
  deploy:
    runs-on: ubuntu-latest
    needs: run-tests  # This job depends on the completion of the 'run-tests' job
    steps:
      - name: Deploy Application
        run: |
          echo "Deployment successful! (This is just an echo for demonstration)"

