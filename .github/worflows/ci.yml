name: Node.js CI

on:
  push:
    branches:
      - main  # Trigger pipeline on pushes to the 'main' branch
  pull_request:
    branches:
      - main  # Trigger pipeline on pull requests to the 'main' branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest version of Ubuntu to run the tests

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # Specify the version of Node.js (adjust as needed)

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        npm install  # Install your dependencies

    # Step 4: Run tests
    - name: Run tests
      run: |
        npm test  # Run your tests (assumes you have a test script in package.json)

    # Step 5: Deploy (echo statement for demonstration)
    - name: Deploy Application
      run: |
        echo "Deployment successful! (This is just an echo for demonstration)"

