name: Node.js CI

on:
  push:
    branches:
      - main  # Trigger workflow on pushes to the 'main' branch
  pull_request:
    branches:
      - main  # Trigger workflow on pull requests to the 'main' branch

jobs:
  # Job 1: Checkout, Install Dependencies, and Run Tests
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2
      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Specify the version of Node.js
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install
      # Step 4: Run tests
      - name: Run tests
        run: npm test

  # Job 2: Checkout, Install Dependencies, and Deploy
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2
      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Specify the version of Node.js
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install
      # Step 4: Deploy (this is just an echo for demonstration)
      - name: Deploy Application
        run: |
          echo "Deployment successful! (This is just an echo for demonstration)"

